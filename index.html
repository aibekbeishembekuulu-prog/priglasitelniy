<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свадебное приглашение</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#fff3e6,#ffffff);
    text-align:center;
    overflow-x:hidden;
}

/* КОНВЕРТ */
#envelopeScreen{
    position:fixed;
    width:100%;
    height:100vh;
    background:linear-gradient(135deg,#fff3e6,#fff);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.envelope{
    width:180px;
    height:120px;
    background:#caa46a;
    position:relative;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.envelope:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:0;
    height:0;
    border-left:90px solid transparent;
    border-right:90px solid transparent;
    border-bottom:70px solid #b88f55;
}

.open-btn{
    margin-top:25px;
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:#caa46a;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

/* HERO */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background: url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e') center/cover;
    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
}

.hero h1 { font-size:42px; }

.btn {
    padding:14px 28px;
    border:none;
    border-radius:30px;
    background:#caa46a;
    color:white;
    font-size:18px;
    margin-top:20px;
    cursor:pointer;
}

section { padding:60px 20px; }

.card {
    max-width:500px;
    margin:20px auto;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

#content { display:none; }

#timer {
    font-size:30px;
    font-weight:bold;
    color:#caa46a;
}

.heart {
    position:fixed;
    top:-10px;
    color:#ff4d6d;
    animation:fall linear infinite;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- 🎁 КОНВЕРТ -->
<div id="envelopeScreen">
    <div class="envelope"></div>
    <h2>У вас есть приглашение</h2>
    <button class="open-btn" onclick="openInvite()">Открыть</button>
</div>

<!-- 🎵 МУЗЫКА -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c0d3f0b2b.mp3?filename=romantic-142696.mp3" type="audio/mpeg">
</audio>

<!-- 💍 КОНТЕНТ -->
<div id="content">

<div class="hero">
    <h2>💍 Свадебное приглашение</h2>
    <h1>Урмат ❤️ Айлин</h1>
    <p>10 октября 2026 • 17:00</p>
    <button class="btn" onclick="window.scrollTo(0,0)">Подробнее</button>
</div>

<section>
<div class="card">
    <h2>Дорогие гости</h2>
    <p>Мы будем рады разделить с вами самый важный день нашей жизни ❤️</p>
</div>
</section>

<section>
<div class="card">
    <h2>Дата и время</h2>
    <p>📅 10.10.2026</p>
    <p>🕔 17:00</p>
</div>
</section>

<section>
<div class="card">
    <h2>Место</h2>
    <p>🏛 Ресторан «Хан Ордо»</p>
    <a href="https://maps.google.com" target="_blank">
        <button class="btn">Открыть карту</button>
    </a>
</div>
</section>

<section>
<div class="card">
    <h2>До свадьбы осталось</h2>
    <div id="timer"></div>
</div>
</section>

<section>
<div class="card">
    <h2>Подтверждение</h2>
    <button class="btn" onclick="confirm()">Я приду</button>
</div>
</section>

</div>

<script>

function openInvite(){
    document.getElementById('envelopeScreen').style.display='none';
    document.getElementById('content').style.display='block';

    // 🎵 музыка старт
    document.getElementById('music').play();

    window.scrollTo(0,0);
}

// таймер
let wedding = new Date("2026-10-10T17:00:00").getTime();

setInterval(()=>{
    let now = new Date().getTime();
    let d = wedding - now;

    let days = Math.floor(d / (1000*60*60*24));
    let hours = Math.floor((d%(1000*60*60*24))/(1000*60*60));
    let min = Math.floor((d%(1000*60*60))/(1000*60));

    document.getElementById("timer").innerHTML =
    days+" дней "+hours+" часов "+min+" минут";
},1000);

// подтверждение
function confirm(){
    alert("Спасибо! Мы вас ждем ❤️");
}
